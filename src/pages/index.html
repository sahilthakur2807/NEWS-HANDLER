<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News App</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-items">
            <li><a href="#" data-category="science">Science</a></li>
            <li><a href="#" data-category="health">Health</a></li>
            <li><a href="#" data-category="business">Business</a></li>
            <li><a href="#" data-category="technology">Technology</a></li>
            <li><a href="#" data-category="sports">Sports</a></li>
            <li><a href="#" data-category="entertainment">Entertainment</a></li>
        </ul>
    </nav>

    <div class="news-container">
        <div class="news-toolbar">
            <div class="search-controls">
                <input type="text" id="news-search" placeholder="Search news..." />
                <button id="search-news">Search</button>
            </div>

            <div class="date-controls">
                <input type="date" id="news-date" />
                <button id="load-new-news">Load News</button>
                <button id="load-favorites-btn">My Favorites</button>
            </div>
        </div>

        <div id="bento-gallery" class="bento-gallery"></div>
    </div>

    <div class="favorites-container">
        <h2>Saved Favorites</h2>
        <div id="favorites-list" class="favorites-list"></div>
    </div>

    <script src="../scripts/config.js"></script>
    <script src="../scripts/newsManager.js"></script>
    <script src="../scripts/scripts.js"></script>
</body>
</html>
