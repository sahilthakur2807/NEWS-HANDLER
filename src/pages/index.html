<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-items">
            <li><a href="#" data-category="home">Home</a></li>
            <li><a href="#" data-category="general">World</a></li>
            <li><a href="#" data-category="general">Politics</a></li>
            <li><a href="#" data-category="business">Business</a></li>
            <li><a href="#" data-category="technology">Technology</a></li>
            <li><a href="#" data-category="sports">Sports</a></li>
            <li><a href="#" data-category="entertainment">Entertainment</a></li>
        </ul>
    </nav>
    <h1>Today's News</h1>
    <h2>Stay updated with the latest global headlines</h2>

    <section class="news-container" aria-label="News controls">
        <div class="news-toolbar">
            <div class="news-controls">
                <label class="control-field" for="news-date">
                    <span class="control-label">Date</span>
                    <input class="control-input" type="date" id="news-date" name="news-date">
                </label>
                <button class="button" type="button" id="load-new-news">Load New News</button>
                <button class="button" type="button" id="load-favorites">Load Favorites</button>
            </div>
        </div>
    </section>

    <section id="bento-gallery" class="bento-gallery" aria-live="polite"></section>

    <section class="favorites-section" aria-label="Favorites">
        <div class="favorites-header">
            <h3>Saved Favorites</h3>
        </div>
        <div id="favorites-list" class="favorites-list"></div>
    </section>

    <script src="../scripts/config.js"></script>
    <script src="../scripts/newsManager.js"></script>
    <script src="../scripts/scripts.js"></script>
</body>
</html>
